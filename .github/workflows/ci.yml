# Spydon GitHub Actions CI Pipeline
# 职责：代码验证、测试、构建镜像
# 部署由 ArgoCD 负责（GitOps 模式）

name: CI Pipeline

on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - main
      - develop
    tags:
      - 'v*'

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ${{ env.REGISTRY }}/${{ github.repository }}/backend
  FRONTEND_IMAGE: ${{ env.REGISTRY }}/${{ github.repository }}/frontend

jobs:
  # 1. 代码质量检查
  pre-commit:
    name: Pre-commit Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pre-commit
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Install pre-commit
        run: pip install pre-commit

      - name: Run pre-commit
        run: pre-commit run --all-files

  backend-lint:
    name: Backend Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: apps/backend/go.sum

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v4
        with:
          version: v1.54.2
          working-directory: apps/backend
          args: --timeout=5m

  frontend-lint:
    name: Frontend Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/frontend/package-lock.json

      - name: Install dependencies
        working-directory: apps/frontend
        run: npm ci

      - name: Run lint
        working-directory: apps/frontend
        run: npm run lint

      - name: Type check
        working-directory: apps/frontend
        run: npm run type-check

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-lint-artifacts
          path: apps/frontend/coverage/
          retention-days: 7

  # 2. 安全扫描
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: [backend-lint, frontend-lint]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-repo.sarif'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-repo.sarif'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: apps/frontend
        run: npm ci

      - name: Run npm audit
        working-directory: apps/frontend
        run: npm audit --audit-level moderate || true
        continue-on-error: true

      - name: Upload scan results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-scan-results
          path: trivy-repo.sarif
          retention-days: 7

  # 3. 后端单元测试
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    needs: backend-lint
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: apps/backend/go.sum

      - name: Install dependencies
        working-directory: apps/backend
        run: go mod download

      - name: Run unit tests
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/test_db?sslmode=disable
          REDIS_URL: redis://localhost:6379
        working-directory: apps/backend
        run: |
          echo "🧪 Running backend tests..."
          go test -v -race -coverprofile=coverage.out -covermode=atomic ./... 2>&1 | tee test.log
          go tool cover -html=coverage.out -o coverage.html
          echo "Coverage:"
          go tool cover -func=coverage.out

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: |
            apps/backend/coverage.out
            apps/backend/coverage.html
            apps/backend/test.log
          retention-days: 7

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: apps/backend/coverage.out
          flags: backend
          token: ${{ secrets.CODECOV_TOKEN }}

  # 4. 前端单元测试
  frontend-test:
    name: Frontend Tests
    runs-on: ubuntu-latest
    needs: frontend-lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/frontend/package-lock.json

      - name: Install dependencies
        working-directory: apps/frontend
        run: npm ci

      - name: Run tests
        working-directory: apps/frontend
        run: |
          echo "🧪 Running frontend tests..."
          npm run test:coverage

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-coverage
          path: apps/frontend/coverage/
          retention-days: 7

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: apps/frontend/coverage/lcov.info
          flags: frontend
          token: ${{ secrets.CODECOV_TOKEN }}

  # 5. 构建 Docker 镜像
  build-backend-image:
    name: Build Backend Image
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test, security-scan]
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
      image-digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.BACKEND_IMAGE }}
          tags: |
            type=sha,format=long
            type=ref,event=branch
            type=ref,event=pr
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push backend image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: apps/backend
          file: apps/backend/Dockerfile.optimized
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT_SHA=${{ github.sha }}
            BUILD_TIME=${{ github.event.repository.updated_at }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy vulnerability scanner on image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          format: 'json'
          output: 'backend-trivy.json'
          exit-code: '0'

      - name: Upload Trivy scan results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-trivy-results
          path: backend-trivy.json
          retention-days: 7

  build-frontend-image:
    name: Build Frontend Image
    runs-on: ubuntu-latest
    needs: [frontend-test, security-scan]
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
      image-digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.FRONTEND_IMAGE }}
          tags: |
            type=sha,format=long
            type=ref,event=branch
            type=ref,event=pr
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push frontend image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: apps/frontend
          file: apps/frontend/Dockerfile.optimized
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT_SHA=${{ github.sha }}
            BUILD_TIME=${{ github.event.repository.updated_at }}
            NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy vulnerability scanner on image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          format: 'json'
          output: 'frontend-trivy.json'
          exit-code: '0'

      - name: Upload Trivy scan results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-trivy-results
          path: frontend-trivy.json
          retention-days: 7

  # 6. 打包 Helm Chart
  package-chart:
    name: Package Helm Chart
    runs-on: ubuntu-latest
    needs: [build-backend-image, build-frontend-image]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/tags/')
    outputs:
      chart-version: ${{ steps.package.outputs.chart-version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: '3.14.4'

      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Package Helm Chart
        id: package
        run: |
          echo "📦 Packaging Helm Chart..."

          # 设置版本号
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            CHART_VERSION="${{ github.ref_name }}"
          else
            CHART_VERSION="0.1.0-${{ github.sha }}"
          fi
          APP_VERSION="${{ github.sha }}"

          echo "chart-version=${CHART_VERSION}" >> $GITHUB_OUTPUT

          # 创建 Chart 目录
          mkdir -p helm-package
          cp -r infrastructure/k8s/helm/spydon helm-package/

          cd helm-package/spydon

          # 更新 Chart.yaml
          yq eval ".version = \"${CHART_VERSION}\"" -i Chart.yaml
          yq eval ".appVersion = \"${APP_VERSION}\"" -i Chart.yaml

          # 更新镜像标签
          yq eval ".backend.image.tag = \"${{ github.sha }}\"" -i values.yaml
          yq eval ".frontend.image.tag = \"${{ github.sha }}\"" -i values.yaml
          yq eval ".backend.image.repository = \"${{ env.BACKEND_IMAGE }}\"" -i values.yaml
          yq eval ".frontend.image.repository = \"${{ env.FRONTEND_IMAGE }}\"" -i values.yaml

          # 打包 Chart
          cd ..
          helm package spydon
          helm repo index . --url "https://github.com/${{ github.repository }}/releases/download"

          echo "✅ Helm Chart packaged successfully"
          echo "Chart Version: ${CHART_VERSION}"
          echo "App Version: ${APP_VERSION}"
          ls -lh *.tgz

      - name: Upload Helm Chart
        uses: actions/upload-artifact@v4
        with:
          name: helm-chart-${{ github.sha }}
          path: |
            helm-package/*.tgz
            helm-package/index.yaml
          retention-days: 30

  # 7. 发布 Helm Chart 到 Harbor
  publish-chart:
    name: Publish Helm Chart
    runs-on: ubuntu-latest
    needs: package-chart
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download Helm Chart
        uses: actions/download-artifact@v4
        with:
          name: helm-chart-${{ github.sha }}
          path: helm-package

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: '3.14.4'

      - name: Publish to Harbor
        env:
          HARBOR_REGISTRY: ${{ secrets.HARBOR_REGISTRY }}
          HARBOR_PROJECT: ${{ secrets.HARBOR_PROJECT }}
          HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
          HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
        run: |
          echo "📤 Publishing Helm Chart to Harbor..."

          CHART_VERSION="${{ needs.package-chart.outputs.chart-version }}"
          CHART_FILE="helm-package/spydon-${CHART_VERSION}.tgz"

          if [ ! -f "$CHART_FILE" ]; then
            echo "Error: Chart file not found: $CHART_FILE"
            exit 1
          fi

          if [ -z "$HARBOR_REGISTRY" ] || [ -z "$HARBOR_PROJECT" ]; then
            echo "Warning: Harbor credentials not configured, skipping publish"
            exit 0
          fi

          helm registry login "$HARBOR_REGISTRY" -u "$HARBOR_USERNAME" -p "$HARBOR_PASSWORD"
          helm push "$CHART_FILE" "oci://$HARBOR_REGISTRY/$HARBOR_PROJECT"

          echo "✅ Helm Chart pushed to Harbor: oci://$HARBOR_REGISTRY/$HARBOR_PROJECT (version: $CHART_VERSION)"

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: helm-package/*.tgz
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
