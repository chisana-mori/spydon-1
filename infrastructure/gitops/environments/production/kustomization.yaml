apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

metadata:
  name: spydon-production
  namespace: spydon-production

resources:
  - ../../base
  - namespace.yaml

patchesStrategicMerge:
  - backend-patch.yaml
  - frontend-patch.yaml
  - postgres-patch.yaml
  - ingress-patch.yaml
  - monitoring-patch.yaml

replicas:
  - name: robusta-backend
    count: 3
  - name: robusta-frontend
    count: 3

images:
  - name: ghcr.io/your-org/spydon/backend
    newTag: main
  - name: ghcr.io/your-org/spydon/frontend
    newTag: main

configMapGenerator:
  - name: robusta-config
    behavior: merge
    literals:
      - ENVIRONMENT=production
      - LOG_LEVEL=info
      - RATE_LIMIT_RPS=1000
      - DATABASE_MAX_CONNECTIONS=50
      - REDIS_POOL_SIZE=20
      - HOLMES_GPT_TIMEOUT=30s
      - MINIO_BUCKET_NAME=spydon-prod
      - MINIO_USE_SSL=true

secretGenerator:
  - name: robusta-secrets
    behavior: merge
    envs:
      - .secrets.env

vars:
  - name: DEPLOYMENT_VERSION
    objref:
      kind: ConfigMap
      name: robusta-config
      apiVersion: v1
    fieldref:
      fieldpath: data.DEPLOYMENT_VERSION
