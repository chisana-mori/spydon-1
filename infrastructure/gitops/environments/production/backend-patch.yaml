apiVersion: apps/v1
kind: Deployment
metadata:
  name: robusta-backend
  namespace: spydon-production
spec:
  replicas: 3
  template:
    spec:
      containers:
        - name: backend
          resources:
            requests:
              memory: "512Mi"
              cpu: "500m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          env:
            - name: ENVIRONMENT
              value: "production"
            - name: LOG_LEVEL
              value: "info"
            - name: DATABASE_MAX_CONNECTIONS
              value: "50"
            - name: REDIS_POOL_SIZE
              value: "20"
            - name: RATE_LIMIT_RPS
              value: "1000"
            - name: HOMES_GPT_TIMEOUT
              value: "30s"
            - name: MINIO_USE_SSL
              value: "true"
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - robusta-backend
                topologyKey: kubernetes.io/hostname
      nodeSelector:
        node-type: application
        environment: production
      tolerations:
        - key: "dedicated"
          operator: "Equal"
          value: "application"
          effect: "NoSchedule"
