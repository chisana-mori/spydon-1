version: '3.8'

# External Services Documentation
# ================================
#
# The following services run as local processes on localhost:
#
# Navy Service:  - Running on localhost:8081 (external process)
# Wayne Service: - Running on localhost:8082 (external process)
# Wayne API:    - Running on localhost:8083 (external process)
#
# These services are not managed by Docker Compose and must be started separately.

services:
  # MySQL数据库
  mysql:
    image: mysql:8.0
    container_name: robusta-mysql
    environment:
      MYSQL_DATABASE: robusta_hub
      MYSQL_ROOT_PASSWORD: password
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_general_ci
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -ppassword --silent"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - robusta-network
    restart: unless-stopped

  # MinIO对象存储
  minio:
    image: minio/minio:latest
    container_name: robusta-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - robusta-network
    restart: unless-stopped

  # Redis（用于缓存和会话存储）
  redis:
    image: redis:7-alpine
    container_name: robusta-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - robusta-network
    restart: unless-stopped
volumes:
  mysql_data:
    driver: local
  minio_data:
    driver: local
  redis_data:
    driver: local

networks:
  robusta-network:
    driver: bridge
