apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: spydon
  namespace: argocd
  labels:
    app: spydon
    environment: production
spec:
  project: default
  source:
    repoURL: https://github.com/your-org/spydon-gitops.git
    targetRevision: main
    path: environments/production
  destination:
    server: https://kubernetes.default.svc
    namespace: spydon-production
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
      - ApplyOutOfSyncOnly=true
      - Prune=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas
  revisionHistoryLimit: 10
  info:
    - name: Description
      value: Spydon Alert Management Platform
    - name: Contact
      value: DevOps Team
    - name: Repository
      value: https://github.com/your-org/spydon

