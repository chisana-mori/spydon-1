apiVersion: v1
kind: ConfigMap
metadata:
  name: hub-proxy-nginx-conf
  namespace: robusta

data:
  nginx.conf: |
    worker_processes  1;
    events { worker_connections  1024; }
    http {
      resolver kube-dns.kube-system.svc.cluster.local valid=10s ipv6=off;
      # 详细日志格式，包含所有可能的headers
      log_format robusta_headers '$remote_addr - $remote_user [$time_local] "$request" '
                                '$status $body_bytes_sent "$http_referer" '
                                '"$http_user_agent" "$http_x_forwarded_for" '
                                'X-API-Key="$http_x_api_key" '
                                'x-api-key="$http_x_api_key" '
                                'Authorization="$http_authorization" '
                                'authorization="$http_authorization" '
                                'X-Robusta-Cluster-ID="$http_x_robusta_cluster_id" '
                                'x-robusta-cluster-id="$http_x_robusta_cluster_id" '
                                'Content-Type="$http_content_type" '
                                'content-type="$http_content_type" '
                                'Content-Length="$http_content_length" '
                                'User-Agent="$http_user_agent" '
                                'Host="$host" '
                                'ALL_HEADERS="$sent_http_*"';

      access_log /var/log/nginx/access.log robusta_headers;

      upstream hub_backend {
        server host.docker.internal:8080;
      }

      server {
        listen 8080;
        location / {
          proxy_pass http://hub_backend;
          proxy_pass_request_headers on;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;

          # 临时解决方案：由于 Robusta webhook_sink 不发送配置的 headers，
          # 我们在 proxy 层添加 API Key
          proxy_set_header X-API-Key "rsk_rqDbQnga1CJXUjABWLZSZCsz8ieg-FzXwKxvy5-yqSI=";
          proxy_set_header Authorization "Bearer rsk_rqDbQnga1CJXUjABWLZSZCsz8ieg-FzXwKxvy5-yqSI=";
          proxy_set_header X-Robusta-Cluster-ID "robusta-kind";
        }
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hub-proxy
  namespace: robusta
  labels:
    app: hub-proxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hub-proxy
  template:
    metadata:
      labels:
        app: hub-proxy
    spec:
      containers:
      - name: nginx
        image: nginx:1.25-alpine
        args: ["nginx","-g","daemon off;","-c","/etc/nginx/nginx.conf"]
        ports:
        - containerPort: 8080
        volumeMounts:
        - name: conf
          mountPath: /etc/nginx/nginx.conf
          subPath: nginx.conf
      volumes:
      - name: conf
        configMap:
          name: hub-proxy-nginx-conf
          items:
          - key: nginx.conf
            path: nginx.conf
---
apiVersion: v1
kind: Service
metadata:
  name: hub-proxy
  namespace: robusta
  labels:
    app: hub-proxy
spec:
  selector:
    app: hub-proxy
  ports:
  - name: http
    port: 8080
    targetPort: 8080
    protocol: TCP
