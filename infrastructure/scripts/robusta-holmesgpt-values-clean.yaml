# 全局 Prometheus 配置
globalConfig:
  prometheus_url: http://prometheus.robusta.svc.cluster.local:9090
  investigation_type: "PrometheusAlert"
  context: {}
  cluster_name: robusta-kind

# Runner 配置
runner:
  additionalEnvVars:
  - name: WEBHOOK_API_KEY
    value: "rsk_rqDbQnga1CJXUjABWLZSZCsz8ieg-FzXwKxvy5-yqSI="
  - name: WEBHOOK_CLUSTER_ID
    value: "robusta-kind"

# 启用 HolmesGPT
enableHolmesGPT: true

# HolmesGPT 配置
holmes:
  enablePostProcessing: true
  additionalEnvVars:
  - name: OVERRIDE_MAX_CONTENT_SIZE
    value: "200000"
  - name: OVERRIDE_MAX_OUTPUT_TOKEN
    value: "18192"
  modelList:
    # openrouter_openai:
      # model: openrouter/qwen/qwen3-32b
      # api_key: "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"
      # api_base: https://openrouter.ai/api/v1
      # temperature: 0
    # deepseek:
    #   model: deepseek/deepseek-chat
    #   api_key: "sk-d8a509507c05475aa65956c50866d63d"
    #   api_base: https://api.deepseek.com/v1
    #   temperature: 0
    glm:
      model: anthropic/glm-4.6
      api_key: "7058a4eab2434994b956543d27beb40d.ERlzZacM9BrAZMzt"
      api_base: https://api.z.ai/api/anthropic
      temperature: 0

  # 启用内置工具集
  toolsets:
    robusta:
      enabled: true
    kubernetes/core:
      enabled: true
    kubernetes/logs:
      enabled: true
    helm/core:
      enabled: true
    internet/core:
      enabled: true
    prometheus/metrics:
      enabled: true
      config:
        prometheus_url: http://prometheus.robusta.svc.cluster.local:9090

# 邮件通知配置
sinksConfig:
  - webhook_sink:
      size_limit: 100000000
      name: hub_webhook
      format: json
      # 通过 hub-proxy 访问后端（hub-proxy 会透传 headers）
      url: "http://hub-proxy.robusta.svc.cluster.local:8080/api/v1/ingest/robusta-webhook"
      authorization: "Bearer rsk_fNKhXrltaRNAJq7eIlqXCJkUjhMPsEuPVBds3QWGyt8="
      aggregation_key: "$finding_title-$finding_severity"

  # - mail_sink:
