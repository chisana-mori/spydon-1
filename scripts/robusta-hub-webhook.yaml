nameOverride: robusta
fullnameOverride: robusta
clusterName: robusta-kind
runner:
  log_level: DEBUG
prometheusStack:
  enabled: true
sinksConfig:
  - webhook_sink:
      name: hub_webhook
      url: "http://host.docker.internal:8080/api/v1/ingest/robusta-webhook"
      headers:
        X-Robusta-Cluster-ID: "robusta-kind"

# 定义最小可用的自定义playbook，将Pod CrashLoop事件作为Finding发送到 webhook sink
customPlaybooks:
  - name: PodCrashLoopToHub
    triggers:
      - on_pod_crash_loop:
          restart_count: 1
    actions:
      - create_finding:
          title: "Pod CrashLoop: $name"
          aggregation_key: "PodCrashLoop"
          severity: HIGH
    sinks:
      - "hub_webhook"

playbooksPersistentVolume: true
