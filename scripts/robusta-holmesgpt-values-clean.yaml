# 全局 Prometheus 配置
globalConfig:
  prometheus_url: http://prometheus.robusta.svc.cluster.local:9090
  investigation_type: "PrometheusAlert"
  context: {}
  cluster_name: robusta-kind

# 启用 HolmesGPT
enableHolmesGPT: true

# HolmesGPT 配置
holmes:
  enablePostProcessing: true
  # 配置 DeepSeek API
  additionalEnvVars:
    - name: MODEL
      value: "deepseek/deepseek-chat"
    - name: DEEPSEEK_API_KEY
      valueFrom:
        secretKeyRef:
          name: holmes-secrets
          key: deepseekApiKey
  
  # 启用内置工具集
  toolsets:
    robusta:
      enabled: true
    kubernetes/core:
      enabled: true
    kubernetes/logs:
      enabled: true
    helm/core:
      enabled: true
    internet/core:
      enabled: true
    prometheus/metrics:
      enabled: true
      config:
        prometheus_url: http://prometheus.robusta.svc.cluster.local:9090

# 邮件通知配置
sinksConfig:
  - webhook_sink:
      size_limit: 100000000
      name: hub_webhook
      url: "http://hub-proxy.robusta.svc.cluster.local:8080/api/v1/ingest/robusta-webhook"
      headers:
        X-API-Key: "dev-api-key-123"
        Authorization: "Bearer dev-api-key-123"
        X-Robusta-Cluster-ID: "robusta-kind"
      aggregation_key: "$finding_title-$finding_severity"
  
  # - mail_sink:
  #     name: holmes_email_sink
