  #     with_header: true

# 自定义 Playbooks
customPlaybooks:
  # 转发所有 Prometheus 告警到 Hub
  - name: ForwardAllPromAlerts
    triggers:
      - on_prometheus_alert: {}
    actions:
      - create_finding:
          title: "Prometheus Alert: $alert_name ($fingerprint)"
          severity: HIGH
          aggregation_key: "PromAlert-$alertname-$fingerprint"
    sinks:
      - "hub_webhook"

  # 发送 Prometheus 告警到邮件（HolmesGPT 会自动分析）
  - name: PrometheusAlertsToEmail
    triggers:
      - on_prometheus_alert: {}
    actions:
      - create_finding:
          title: "🚨 Kubernetes 告警: $alert_name"
          description: |
            告警详情:
            - 告警名称: $alert_name
            - 集群: $cluster_name
            - 命名空间: $namespace
            - 严重程度: $severity
            - 描述: $description

            HolmesGPT 将自动分析此告警并提供根因分析。
          severity: HIGH
          aggregation_key: "Alert-$alertname-$fingerprint"
      - default_enricher: {}
      - alert_definition_enricher: {}
      - logs_enricher: {}
      - ask_holmes:
          investigation_type: "analyze_problems"  # 必需字段  
          ask: "Please analyze this Kubernetes issue and provide root cause analysis"
          context: {}
          aggregation_key: "Alert-$alertname-$fingerprint"
    sinks:
      - "hub_webhook"

  # ImagePullBackOff 告警通知
  - name: ImagePullBackoffNotification
    triggers:
      - on_image_pull_backoff:
          rate_limit: 5
    actions:
      - create_finding:
          title: "🔍 镜像拉取失败: $name ($namespace)"
          description: |
            Pod 详情:
            - Pod 名称: $name
            - 命名空间: $namespace
            - 集群: $cluster_name

            HolmesGPT 将自动分析此问题并提供解决方案。
          severity: HIGH
          aggregation_key: "ImgPullBackoff-$namespace-$name"
    sinks:
      - "hub_webhook"

  # 通用 Kubernetes Warning 事件 -> 邮件（HolmesGPT 自动分析）
  - name: KubernetesWarningsToEmail
    triggers:
      - on_kubernetes_warning_event_create: {}
    actions:
      - create_finding:
          title: "⚠️ Kubernetes Warning: $reason ($namespace/$name)"
          description: |
            事件详情:
            - 类型: $type
            - 原因: $reason
            - 对象: $namespace/$name
            - 信息: $message
          severity: MEDIUM
          aggregation_key: "K8sWarning-$namespace-$name-$reason"
      - event_resource_events: {}
      # - ask_holmes:
      #     investigation_type: "analyze_problems"  # 必需字段  
      #     ask: "Please analyze this Kubernetes issue and provide root cause analysis"
      #     context: {}
      #     aggregation_key: "K8sWarning-$namespace-$name-$reason"
    sinks:
      - "hub_webhook"

  # 常见 Pod 故障 -> 邮件（HolmesGPT 自动分析）
  - name: KubernetesPodFailuresToEmail
    triggers:
      - on_pod_crash_loop: {}
      - on_image_pull_backoff: {}
      - on_pod_oom_killed: {}
      - on_container_oom_killed: {}
      - on_pod_evicted: {}
    actions:
      - create_finding:
          title: "❗ Pod 故障: $name ($namespace)"
          description: |
            事件详情:
            - 类型: $type
            - 原因: $reason
            - 对象: $namespace/$name
            - 消息: $message
          severity: HIGH
          aggregation_key: "K8sPodFailure-$namespace-$name-$reason"
      - logs_enricher: {}
      - pod_events_enricher: {}
      # - ask_holmes:
      #     investigation_type: "analyze_problems"  # 必需字段  
      #     ask: "Please analyze this Kubernetes issue and provide root cause analysis"
      #     context: {}
      #     aggregation_key: "K8sPodFailure-$namespace-$name-$reason"
    sinks:
      - "hub_webhook"

  # 常见 Job 故障 -> 邮件（HolmesGPT 自动分析）
  - name: KubernetesJobFailuresToEmail
    triggers:
      - on_job_failure: {}
    actions:
      - create_finding:
          title: "❗ Job 失败: $name ($namespace)"
          description: |
            事件详情:
            - 类型: $type
            - 对象: $namespace/$name
            - 消息: $message
          severity: HIGH
          aggregation_key: "K8sJobFailure-$namespace-$name"
      - job_info_enricher: {}
      - job_events_enricher: {}
      - job_pod_enricher: {}
      # - ask_holmes:
      #     investigation_type: "analyze_problems"  # 必需字段  
      #     ask: "Please analyze this Kubernetes issue and provide root cause analysis"
      #     context: {}
      #     aggregation_key: "K8sJobFailure-$namespace-$name"
    sinks:
      - "hub_webhook"

playbookRepos: {}
playbooksPersistentVolume: false
