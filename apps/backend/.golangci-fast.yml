# Fast golangci-lint configuration for development
run:
  timeout: 5m
  tests: false

output:
  formats:
    - format: colored-line-number
      print-issued-lines: true
      print-linter-name: true
  sort-results: true

linters-settings:
  govet:
    enable-all: true
    disable:
      - fieldalignment

  gocyclo:
    min-complexity: 20

  goconst:
    min-len: 3
    min-occurrences: 3

  gofmt:
    simplify: true

  goimports:
    local-prefixes: robusta-web/backend

  golint:
    min-confidence: 0.8

  misspell:
    locale: US

  lll:
    line-length: 150

  unused:
    check-exported: false

  unparam:
    check-exported: false

  nakedret:
    max-func-lines: 40

  funlen:
    lines: 150
    statements: 80

  gocognit:
    min-complexity: 25

  nestif:
    min-complexity: 5

  godot:
    scope: toplevel
    capital: false

  nolintlint:
    allow-leading-space: true
    allow-unused: false
    require-explanation: false
    require-specific: false

linters:
  disable-all: true
  enable:
    # Essential linters
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - typecheck
    - unused

    # Style and formatting
    - gofmt
    - goimports
    - misspell
    - whitespace

    # Basic checks
    - bodyclose
    - contextcheck
    - durationcheck
    - errorlint
    - forcetypeassert
    - noctx
    - nilerr
    - nilnil
    - rowserrcheck
    - sqlclosecheck
    - unconvert

    # Security
    - gosec

issues:
  exclude-dirs:
    - vendor
    - bin
  exclude-files:
    - ".*\\.pb\\.go$"
    - ".*_generated\\.go$"
  exclude-rules:
    # Exclude some linters from running on tests files
    - path: _test\.go
      linters:
        - gocyclo
        - errcheck
        - gosec
        - funlen
        - gocognit

    # Exclude shadow checking on err variables
    - text: "shadow: declaration of \"err\""
      linters:
        - govet

    # Exclude magic number warnings for common values
    - text: "Magic number: [0-2]"
      linters:
        - mnd

    # Exclude certain staticcheck issues
    - text: "SA9003: empty branch"
      linters:
        - staticcheck

    # Exclude error strings that should not be capitalized
    - text: "ST1005: error strings should not be capitalized"
      linters:
        - stylecheck

    # Exclude Chinese comments from godot check
    - text: "Comment should end in a period"
      source: "//.*[\u4e00-\u9fff]"
      linters:
        - godot

    # Exclude package comments for non-main packages
    - text: "package-comments: should have a package comment"
      linters:
        - revive

  uniq-by-line: true
  max-issues-per-linter: 0
  max-same-issues: 0

severity:
  default-severity: error
  case-sensitive: false