# Fast golangci-lint configuration for development
# 配置文件版本（必需）
version: "2"

run:
  timeout: 5m
  tests: false

output:
  format: colored-line-number
  print-issued-lines: true
  print-linter-name: true
  sort-results: true

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    gofmt:
      simplify: true
    goimports:
      local-prefixes:
        - robusta-web/backend

linters:
  disable-all: true
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - misspell
    - whitespace
    - bodyclose
    - durationcheck
    - errorlint
    - forcetypeassert
    - rowserrcheck
    - sqlclosecheck
    - unconvert
    - gosec

  settings:
    govet:
      enable-all: true
      disable:
        - fieldalignment

    gocyclo:
      min-complexity: 20

    goconst:
      min-len: 3
      min-occurrences: 3

    misspell:
      locale: US

    lll:
      line-length: 150

    unused:
      check-exported: false

    unparam:
      check-exported: false

    nakedret:
      max-func-lines: 40

    funlen:
      lines: 150
      statements: 80

    gocognit:
      min-complexity: 25

    nestif:
      min-complexity: 5

    godot:
      scope: toplevel
      capital: false

    nolintlint:
      allow-leading-space: true
      allow-unused: false
      require-explanation: false
      require-specific: false

    gosec:
      excludes:
        - G402  # TLS MinVersion too low
        - G301  # Directory permissions
        - G302  # File permissions
        - G304  # File inclusion via variable

issues:
  exclude-dirs:
    - vendor
    - bin
  exclude-files:
    - ".*\\.pb\\.go$"
    - ".*_generated\\.go$"
  exclude-rules:
    - path: _test\.go
      linters:
        - gocyclo
        - errcheck
        - gosec
        - funlen
        - gocognit

    - text: "shadow: declaration of \"err\""
      linters:
        - govet

    - text: "Magic number: [0-2]"
      linters:
        - mnd

    - text: "SA9003: empty branch"
      linters:
        - staticcheck

    - text: "ST1005: error strings should not be capitalized"
      linters:
        - stylecheck

    - text: "Comment should end in a period"
      source: "//.*[\u4e00-\u9fff]"
      linters:
        - godot

    - text: "package-comments: should have a package comment"
      linters:
        - revive

  uniq-by-line: true
  max-issues-per-linter: 0
  max-same-issues: 0

severity:
  default-severity: error
  case-sensitive: false
