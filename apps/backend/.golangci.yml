# golangci-lint configuration file
# https://golangci-lint.run/usage/configuration/

# 配置文件版本（必需）
version: "2"

run:
  timeout: 5m
  issues-exit-code: 1
  tests: false

output:
  format: colored-line-number
  print-issued-lines: true
  print-linter-name: true
  sort-results: true

linters:
  disable-all: true
  enable:
    # Default enabled linters
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused

    # Additional enabled linters
    - asciicheck
    - bidichk
    - bodyclose
    - contextcheck
    - cyclop
    - dupl
    - durationcheck
    - errorlint
    - exhaustive
    - copyloopvar
    - forbidigo
    - forcetypeassert
    - gochecknoinits
    - gocognit
    - goconst
    - gocritic
    - gocyclo
    - godot
    - mnd
    - gomoddirectives
    - gomodguard
    - goprintffuncname
    - gosec
    - lll
    - makezero
    - misspell
    - nakedret
    - nestif
    - nilerr
    - nilnil
    - noctx
    - nolintlint
    - nonamedreturns
    - nosprintfhostport
    - prealloc
    - predeclared
    - revive
    - rowserrcheck
    - sqlclosecheck
    - tparallel
    - unconvert
    - unparam
    - wastedassign
    - whitespace
  disable:
    - contextcheck
    - dupl  # Disabled due to necessary duplication in v1/v3 API adapter code
    - gosec
    - gochecknoinits
    - gocognit
    - cyclop
    - gocyclo
    - goconst
    - gocritic
    - nilnil
    - staticcheck
    - godot
    - mnd
    - lll
    - revive
    - nestif
    - noctx
    - unparam
    - nonamedreturns
    - wastedassign

  settings:
    govet:
      enable-all: true
      disable:
        - fieldalignment

    gocyclo:
      min-complexity: 15

    goconst:
      min-len: 3
      min-occurrences: 3

    misspell:
      locale: US

    lll:
      line-length: 120

    unused:
      check-exported: false

    unparam:
      check-exported: false

    nakedret:
      max-func-lines: 30

    prealloc:
      simple: true
      range-loops: true
      for-loops: false

    gocritic:
      enabled-tags:
        - diagnostic
        - experimental
        - opinionated
        - performance
        - style
      disabled-checks:
        - dupImport
        - ifElseChain
        - octalLiteral
        - whyNoLint
        - wrapperFunc

    funlen:
      lines: 100
      statements: 50

    gocognit:
      min-complexity: 20

    nestif:
      min-complexity: 4

    mnd:
      checks:
        - argument
        - case
        - condition
        - operation
        - return
        - assign

    godot:
      scope: all
      exclude:
        - "SPDX-License-Identifier:"
      capital: false

    nonamedreturns:
      exclude:
        - "New.*"
        - "NewContext.*"

    nolintlint:
      allow-leading-space: true
      allow-unused: false
      require-explanation: false
      require-specific: false

    staticcheck:
      checks: ["all"]

    stylecheck:
      checks: ["all", "-ST1000", "-ST1003", "-ST1016", "-ST1020", "-ST1021", "-ST1022"]

    gosec:
      excludes:
        - G402  # TLS MinVersion too low
        - G301  # Directory permissions
        - G302  # File permissions
        - G304  # File inclusion via variable

issues:
  exclude-dirs:
    - vendor
    - bin
    - internal/pkg/calico/v1  # Generated v1 API adapter code (has necessary duplication)
  exclude-files:
    - ".*\\.pb\\.go$"
    - ".*_generated\\.go$"
  exclude-rules:
    - path: _test\.go
      linters:
        - gocyclo
        - errcheck
        - dupl
        - gosec
        - lll
        - funlen
        - gocognit

    - path: cmd/
      linters:
        - gochecknoinits

    - text: "shadow: declaration of \"err\""
      linters:
        - govet

    - text: "Magic number: [0-2]"
      linters:
        - mnd

    - text: "line is .* characters"
      source: "^import"
      linters:
        - lll

    - text: "Function 'main' has too many lines"
      linters:
        - funlen

    - text: "SA9003: empty branch"
      linters:
        - staticcheck

    - text: "ST1005: error strings should not be capitalized"
      linters:
        - stylecheck

  uniq-by-line: true
  exclude-use-default: false
  max-issues-per-linter: 0
  max-same-issues: 0
  new: false

severity:
  default-severity: error
  case-sensitive: false
