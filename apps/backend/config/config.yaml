environment: development
port: "8080"

database_url: postgres://postgres:password@localhost:5432/robusta_hub?sslmode=disable

jwt_secret: your-jwt-secret-key
hmac_secret: your-hmac-secret-key
ingest_api_key: ""

oidc_issuer: ""
oidc_client_id: ""
oidc_client_secret: ""

holmes_gpt:
  url: http://localhost:8081
  api_key: ""
  timeout_seconds: 300
  enabled: true
  default_depth: standard
  model: deepseek-reasoner
  proxy_auth_token: ""

cas:
  enabled: false
  server_url: ""
  callback_path: /auth/cas/callback
  redirect_url: http://localhost:3000
  default_email_domain: cas.local
  email_attribute: mail
  name_attribute: displayName
  roles_attribute: roles

minio:
  endpoint: localhost:9000
  access_key: minioadmin
  secret_key: minioadmin
  bucket_name: robusta-artifacts
  use_ssl: false

rate_limit_rps: 100
log_level: info

email:
  smtp_host: ""
  smtp_port: 587
  smtp_user: ""
  smtp_pass: ""
  from: ""
  rca_to: ""
  enabled: false
