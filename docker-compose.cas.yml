version: '3.8'

services:
  # Apereo CAS服务
  cas:
    image: apereo/cas:latest
    container_name: apereo-cas
    environment:
      # CAS配置
      CAS_SERVER_NAME: https://localhost:8443
      CAS_SERVER_PREFIX: https://localhost:8443/cas
      CAS_HOSTNAME: localhost
      CAS_PORT: 8443

      # 管理凭证
      CAS_ADMIN_USER: casadmin
      CAS_ADMIN_PASSWORD: Mellon

      # 服务注册
      CAS_SERVICE_REGISTRY_JSON_LOCATION: file:/etc/cas/services
      CAS_SERVICE_REGISTRY_JSON_ENABLED: "true"
      CAS_SERVICE_REGISTRY_CORE_INIT_FROM_JSON: "true"

      # 认证配置 - 使用静态用户
      CAS_AUTHN_ACCEPT_USERS: casuser::Mellon
      CAS_AUTHN_ACCEPT_ENABLED: true

      # CAS Profiles
      SPRING_PROFILES_ACTIVE: standalone,json-service-registry

      # 日志配置
      LOG_LEVEL: INFO
      LOGGING_LEVEL_ROOT: INFO
      LOGGING_LEVEL_ORG_APACHE_CATALINA: INFO
      LOGGING_LEVEL_ORG_APACHE_COYOTE: INFO
      LOGGING_LEVEL_ORG_APACHE_TOMCAT: INFO
      LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_SECURITY: INFO
      LOGGING_LEVEL_ORG_APEREO_CAS: DEBUG

    ports:
      - "8443:8443"
      - "8080:8080"

    volumes:
      - ./etc/cas:/etc/cas:ro
      - ./etc/cas/logs:/etc/cas/logs

    command: ["java", "-jar", "/etc/cas/war/cas.war"]

    healthcheck:
      test: ["CMD", "curl", "-k", "-f", "https://localhost:8443/cas/login"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

    networks:
      - robusta-network

    restart: unless-stopped

networks:
  robusta-network:
    external:
      name: robusta-web_robusta-network