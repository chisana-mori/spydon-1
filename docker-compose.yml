version: '3.8'

services:
  # PostgreSQL数据库
  postgres:
    image: postgres:15-alpine
    container_name: robusta-postgres
    environment:
      POSTGRES_DB: robusta_hub
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - robusta-network

  # MinIO对象存储
  minio:
    image: minio/minio:latest
    container_name: robusta-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - robusta-network

  # 后端服务
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: robusta-backend
    environment:
      ENVIRONMENT: development
      PORT: 8080
      DATABASE_URL: postgres://postgres:password@postgres:5432/robusta_hub?sslmode=disable
      JWT_SECRET: your-jwt-secret-key-change-in-production
      HMAC_SECRET: your-hmac-secret-key-change-in-production
      OIDC_ISSUER: https://your-oidc-provider.example.com
      OIDC_CLIENT_ID: robusta-central-hub
      OIDC_CLIENT_SECRET: your-oidc-client-secret
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET_NAME: robusta-artifacts
      MINIO_USE_SSL: false
      HOLMES_GPT_URL: http://holmesgpt:8081
      HOLMES_GPT_API_KEY: your-holmes-api-key
      HOLMES_GPT_TIMEOUT: 300
      HOLMES_GPT_ENABLED: true
      HOLMES_GPT_DEFAULT_DEPTH: standard
      RATE_LIMIT_RPS: 100
      LOG_LEVEL: info
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - robusta-network

  # 前端服务
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: robusta-frontend
    ports:
      - "3000:3000"
    environment:
      VITE_API_BASE_URL: http://localhost:8080/api/v1
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - robusta-network

  # Redis（用于缓存和会话存储）
  redis:
    image: redis:7-alpine
    container_name: robusta-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - robusta-network

  # HolmesGPT服务（可选）
  holmesgpt:
    image: holmesgpt/holmes:latest
    container_name: robusta-holmesgpt
    environment:
      OPENAI_API_KEY: your-openai-api-key
      HOLMES_PORT: 8081
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - robusta-network
    restart: unless-stopped
    profiles:
      - holmes  # 使用 docker-compose --profile holmes up 启动

volumes:
  postgres_data:
    driver: local
  minio_data:
    driver: local
  redis_data:
    driver: local

networks:
  robusta-network:
    driver: bridge
