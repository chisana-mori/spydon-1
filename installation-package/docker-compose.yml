version: '3.8'

services:
  # Nginx Reverse Proxy
  nginx:
    image: nginx:1.25-alpine
    container_name: nginx
    platform: linux/amd64
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./logs:/var/log/nginx
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - robusta-network
    restart: unless-stopped

  # External Backend Services (Local Processes)
  # NOTE: These services run as local processes on localhost
  # Navy Service:  Running on localhost:8081 (external process)
  # Wayne API Service: Running on localhost:8082 (external process)
  # Wayne Service: Running on localhost:8083 (external process)
  # Spydon Service: Running on localhost:8086 (external process)
  # Spydon Frontend: Running on localhost:3000 (external process)
  # Traefik will route to these external services via host network

    # PostgreSQL数据库
  postgres:
    image: postgres:15-alpine
    container_name: robusta-postgres
    environment:
      POSTGRES_DB: robusta_hub
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../../apps/backend/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - robusta-network
    restart: unless-stopped

  # MinIO对象存储
  minio:
    image: minio/minio:latest
    container_name: robusta-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - robusta-network
    restart: unless-stopped

  # Redis（用于缓存和会话存储）
  redis:
    image: redis:7-alpine
    container_name: robusta-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - robusta-network
    restart: unless-stopped

  # Spydon 前端开发容器（使用离线基础镜像）
  spydon-fe:
    image: robusta-frontend-offline-base:node24
    container_name: spydon-fe
    platform: linux/amd64
    environment:
      WORKSPACE_DIR: /workspace
    volumes:
      - /home/hny/spydon/apps/frontend:/workspace
    extra_hosts:
      - "host.docker.internal:host-gateway"
    network_mode: host
    restart: unless-stopped
volumes:
  postgres_data:
    driver: local
  minio_data:
    driver: local
  redis_data:
    driver: local

networks:
  robusta-network:
    driver: bridge
