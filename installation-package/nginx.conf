events {
    worker_connections 1024;
}

http {
    # Basic settings
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Logging
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # Upstream definitions for backend services
    upstream navy-service {
        server host.docker.internal:8081;
    }

    upstream wayneapi-service {
        server host.docker.internal:8082;
    }

    upstream wayne-service {
        server host.docker.internal:8083;
    }

    upstream spydon-service {
        server host.docker.internal:8086;
    }

    upstream spydon-fe-service {
        server host.docker.internal:3000;
    }

    server {
        listen 80;
        server_name _;

        # Navy Service - /navy -> localhost:8081
        location /navy/ {
            rewrite ^/navy/(.*)$ /$1 break;
            proxy_pass http://navy-service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto http;
            proxy_connect_timeout 30s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }

        location = /navy {
            rewrite ^/navy$ / break;
            proxy_pass http://navy-service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto http;
        }

        # Wayne API Service - /wayneapi -> localhost:8082
        location /wayneapi/ {
            rewrite ^/wayneapi/(.*)$ /$1 break;
            proxy_pass http://wayneapi-service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto http;
            proxy_connect_timeout 30s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }

        location = /wayneapi {
            rewrite ^/wayneapi$ / break;
            proxy_pass http://wayneapi-service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto http;
        }

        # Wayne Service - /wayne -> localhost:8083
        location /wayne/ {
            rewrite ^/wayne/(.*)$ /$1 break;
            proxy_pass http://wayne-service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto http;
            proxy_connect_timeout 30s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }

        location = /wayne {
            rewrite ^/wayne$ / break;
            proxy_pass http://wayne-service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto http;
        }

        # Spydon Service - /spydon -> localhost:8086
        # Example: /spydon/api/v1 -> localhost:8086/api/v1
        location /spydon/ {
            rewrite ^/spydon/(.*)$ /$1 break;
            proxy_pass http://spydon-service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto http;
            proxy_connect_timeout 30s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }

        location = /spydon {
            rewrite ^/spydon$ / break;
            proxy_pass http://spydon-service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto http;
        }

        # Spydon Frontend - /spydon-fe -> localhost:3000
        location /spydon-fe/ {
            rewrite ^/spydon-fe/(.*)$ /$1 break;
            proxy_pass http://spydon-fe-service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto http;
            proxy_connect_timeout 30s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }

        location = /spydon-fe {
            rewrite ^/spydon-fe$ / break;
            proxy_pass http://spydon-fe-service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto http;
        }

        # Next.js 静态资源 - /_next -> localhost:3000/_next
        location /_next/ {
            proxy_pass http://spydon-fe-service/_next/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto http;
            proxy_connect_timeout 30s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }

        # Health check endpoint
        location /nginx-health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
    }
}
